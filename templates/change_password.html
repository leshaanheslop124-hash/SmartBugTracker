<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Smart Bug Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>Smart Bug Tracker</h2>

    <div>

        <a href="/profile">Profile</a>

        {% if user.Role == "Admin" %}

            <a href="/admin">Admin Panel</a>

        {% else %}

            <a href="/dashboard">Dashboard</a>

        {% endif %}

        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>Change Password</h1>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        <label for="current_password">
            Current Password
        </label>

        <input
            type="password"
            id="current_password"
            name="current_password"
            required
        >


        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
        >


        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >


        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>

</html>
