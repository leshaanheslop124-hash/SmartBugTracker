<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Smart Bug Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>Smart Bug Tracker</h2>

    <div>

        <a href="/profile">Profile</a>

        {% if user.Role == "Admin" %}

            <a href="/admin">Admin Panel</a>

        {% else %}

            <a href="/dashboard">Dashboard</a>

        {% endif %}

        <a href="/logout">Logout</a>

    </div>

</nav>


<div class="container">

    <h1>Edit Profile</h1>


    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        <label for="first_name">
            First Name
        </label>

        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ user.FirstName }}"
            required
        >


        <label for="last_name">
            Last Name
        </label>

        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ user.LastName }}"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ user.Email }}"
            required
        >


        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

</body>

</html>
